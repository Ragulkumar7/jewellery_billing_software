# Single source of truth for Railway builds. Never add corepack/npm-installed
# pnpm to these phases — Nix's pnpm-9_x is the binary; corepack crashes on Node 24.

[phases.setup]
nixPkgs = ["nodejs_24", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm i --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter admin-api build"]

[start]
cmd = "pnpm --filter admin-api start"
